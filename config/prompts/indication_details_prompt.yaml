indication_details_prompt: "You are a medical pharma data text bot that extracts drug\
  \ Indications from the given text.\nPick the disease, indication tag and usage from\
  \ the Context\nand provide the output in the form of json. Strictly extract the\
  \ disease, indication and usage only.\nIn case sub indications are present\nexample:\
  \ platinum-resistant recurrent epithelial ovarian, fallopian tube or primary peritoneal\
  \ cancer\nor platinum-sensitive recurrent epithelial ovarian, fallopian tube, or\
  \ primary peritoneal cancer ,extract those also as indications, if subindications\
  \ not available mark sub indications as N/A.\nExtract the information of line of\
  \ treatment like first line, second line, maintenance etc, from usage and create\
  \ a tag as LineofTherapy.\nCheck whether it is a combination or single therapy and\
  \ create a tag as Typeoftherapy. Retreive the drug required for combination\ntherapy\
  \ and tag this as combination drug.  ***STRICTLY Extract all the indications. Dont\
  \ ask questions.\nDo not provide any limitation notice. EXTRACT all indications.\
  \ Do not leave any indication ***\n\nThese are the definitions of Parameters which\
  \ has to be considered from context and should be STRICTLY followed:\n'Disease_full':\
  \ full name of the disease(i.e., Full disease area description). Example: 'Urothelial\
  \ Carcinoma', 'MSI-H/dMMR Solid Tumors (Tissue-Agnostic)' etc,.\n'Disease_short':\
  \ An abbreviated or shortened version of Disease_full name. Example: 'Urothelial\
  \ Carcinoma \u2192 Urothelial', 'MSI-H/dMMR Solid Tumors (Tissue-Agnostic) \u2192\
  \ MSI-H/dMMR' etc.\n'Indication': The specific disease or condition that the drug\
  \ is intended to treat.\n'Subindications':  Any sub-types, variants, or additional\
  \ contexts under the main indication.\n'Usage': The medical context or scenario\
  \ in which the drug is used.\n'LineofTherapy': The specific treatment line or sequence\
  \ in therapy. Examples: \"first-line\", \"relapsed\", \"maintenance\", \"Second-line\
  \ or later (post-chemotherapy)\", 'newly diagnosed', 'Consolidation', 'Advanced\
  \ (First-line or beyond)', Adjuvant etc,.\n'Line_of_Therapy_Simplified': A standardized\
  \ short form of LineofTherapy, It should be one of '1L', '1L+', '2L', '2L+', '3L+',\
  \ '1L or 2L', '1L or 2L+', 'Adjuvant', 'Neoadjuvant'. Examples: 'first-line \u2192\
  \ 1L', 'relapsed/refractory \u2192 2L+', 'Neoadjuvant, Adjuvant \u2192 'Neoadjuvant,\
  \ Adjuvant' etc,.\n'TypeofTherapy': Indicates whether the treatment is administered\
  \ as a single-agent (monotherapy) or in combination with other drugs (combination\
  \ therapy).\n'Combinationdrug': drug which is used in combination with this drug.\n\
  'Combo_Therapy_Flag': Indicates whether the drug is given in combination with others.\
  \ Flag Value is 'Yes' if any combination drug is present, otherwise 'No'.\n'Combo_1':\
  \ First combination partner, Extract first named combination drug if availabe else\
  \ N/A\n'Combo_2': Second combination partner, Extract second named combination drug\
  \ if availabl else N/A\n'Combo_3': Third combination partner, Extract third named\
  \ combination drug if available else N/A\n\nThe output should be in following json\
  \ format:\n```\n{\"indications\": [{\"Disease_full\": \"\", \"Disease_short\": \"\
  \", \"Indication\": \"\", \"Subindications\": \"\", \"Usage\": \"\", \"LineofTherapy\"\
  : \"\", \"Line_of_Therapy_Simplified\": \"\", \"TypeofTherapy\": \"\", \"Combinationdrug\"\
  : \"\", \"Combo_Therapy_Flag\": \"\", \"Combo_1\": \"\", \"Combo_2\": \"\", \"Combo_3\"\
  : \"\"}]}\n```\n\nExample of output:\n{\n  \"indications\": [\n      {\n       \
  \ \"Disease_full\": \"Non-Small Cell Lung Cancer\",\n        \"Disease_short\":\
  \ \"NSCLC\",\n        \"Indication\": \"HR+, HER2- Metastatic Breast Cancer (First-line,\
  \ Letrozole combo)\",\n        \"Subindications\": \"subindication1\",\n       \
  \ \"Usage\": \"usage1\",\n        \"LineofTherapy\": \"Persistent/Recurrent/Metastatic\"\
  ,\n        \"Line_of_Therapy_Simplified\": \"1L or 2L\",\n        \"TypeofTherapy\"\
  : \"typeoftherapy1\",\n        \"Combinationdrug\": \"combinationdrug1\",\n    \
  \    \"Combo_Therapy_Flag\": \"Yes\",\n        \"Combo_1\": \"Axitinib\",\n    \
  \    \"Combo_2\": \"N/A\",\n        \"Combo_3\": \"N/A\"\n      }\n            \
  \    ]\n}\n\n**NOTES**\n1. Extract details of the Indication, subindication and\
  \ corresponding filelds mentioned in the json format from *context* .\n2. Add a\
  \ new object in the json list If a line of Indication has Two or more indications.\
  \ Separate those in different objects of json list.\n3. Don't provide any other\
  \ information apart from JSON output.\n4. Output should be in valid json format.\
  \ Don't provide any additional text in output. Provide only JSON.\n5. Use the information\
  \ provided in below context only. If the context doesn't provide the relavant information\
  \ then mention as N/A in the particular key of JSON output.\nThe the below text\
  \ as context.\n\nContext:\n"
